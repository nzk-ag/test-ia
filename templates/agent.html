<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nzk_Agent - Tableau de bord</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-800 font-sans min-h-screen">

    <nav class="bg-white border-b border-slate-200 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-teal-300">Nzk_Agent</a>
            <span class="text-slate-50 text-sm">Tableau de bord</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-8">
        <h1 class="text-3xl font-bold text-teal-300 mb-8">Derniers e-mails traités</h1>

        {% if historique|length == 0 %}
        <div class="bg-slate-950 p-8 rounded-xl border border-white text-center shadow-sm">
            <p class="text-white">Aucun e-mail n'a encore été traité par l'IA aujourd'hui.</p>
        </div>
        {% endif %}

        <div class="space-y-6">
            {% for item in historique %}
            <div class="bg-slate-950 p-6 rounded-xl border border-white shadow-sm hover:shadow-md transition">
                <h2 class="text-lg font-bold text-white mb-2">Sujet : {{ item.sujet }}</h2>
                <div class="bg-slate-800 text-white p-4 rounded-lg text-sm leading-relaxed">
                    {{ item.resume }}
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
